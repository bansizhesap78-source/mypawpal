name: Unity CLI keşif

# Unity CLI'nin önerdiği CI iş akışını (lisans etkinleştirme dahil) üretip günlüğe yazar; depoya bir şey yazmaz.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  help:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      UNITY_NO_BANNER: "1"
      UNITY_NO_PAGER: "1"
      UNITY_NON_INTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: unity ci init çıktısı
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          export PATH="$HOME/.unity/bin:$PATH"
          unity ci --help 2>&1 | sed '/^Global Options:/,$d' || true
          unity ci init --help 2>&1 | sed '/^Global Options:/,$d' || true
          unity license status --help 2>&1 | sed '/^Global Options:/,$d' || true
          before=$(git status --porcelain)
          unity ci init --provider github --target iOS 2>&1 || unity ci init 2>&1 || true
          echo "===== üretilen/değişen dosyalar ====="
          git status --porcelain
          for f in $(git status --porcelain | awk '{print $2}'); do
            if [ -d "$f" ]; then find "$f" -type f | while read -r g; do echo "----- $g -----"; cat "$g"; done
            else echo "----- $f -----"; cat "$f"; fi
          done

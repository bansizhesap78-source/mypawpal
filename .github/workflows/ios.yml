name: iOS (App Store Connect)

# Elle başlatılır: Actions > "iOS (App Store Connect)" > Run workflow.
# Tek macOS işi:
#   1) Unity CLI kurulur ve Unity girişi başlatılır. Giriş bağlantısı "unity-login-url" artifact'ına yazılır;
#      bağlantı herhangi bir cihazdaki tarayıcıda açılıp onaylanır (Unity Personal lisansı gözetimsiz
#      etkinleştirilemediği için her derlemede bir kez gerekir).
#   2) Unity 6000.6.3f1 + iOS modülü kurulur, Personal lisans etkinleştirilir, Xcode projesi üretilir.
#   3) App Store Connect API anahtarıyla otomatik imzalanır, IPA dışa aktarılır ve yüklenir. Lisans iade edilir.
# Gerekli sırlar ve kurulum: IOS_BUILD.md

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build numarası (CFBundleVersion). Boşsa çalıştırma numarası kullanılır."
        required: false
        default: ""
      version:
        description: "Sürüm (CFBundleShortVersionString, ör. 1.0.0). Boşsa projedeki sürüm kullanılır."
        required: false
        default: ""
      upload:
        description: "IPA App Store Connect'e (TestFlight) yüklensin mi?"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-build
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ inputs.build_number != '' && inputs.build_number || github.run_number }}
  BUNDLE_VERSION: ${{ inputs.version }}
  UNITY_VERSION: 6000.6.3f1
  UNITY_CHANGESET: 45d8eee7de74
  UNITY_NO_BANNER: "1"
  UNITY_NO_PAGER: "1"

jobs:
  ios:
    name: Unity iOS → imzala → yükle (macOS)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Girdileri ve sırları denetle
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Sır eksik: $name (IOS_BUILD.md)"; exit 1; fi
          done
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Geçersiz build numarası: $BUILD_NUMBER"; exit 1
          fi
          if [ -n "$BUNDLE_VERSION" ] && ! [[ "$BUNDLE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Geçersiz sürüm: $BUNDLE_VERSION"; exit 1
          fi
          xcodebuild -version

      - name: Unity CLI'yi kur
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          echo "$HOME/.unity/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Library önbelleği
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-mac-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-mac-

      - name: Unity editör önbelleğini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/unityhub/downloads
          key: unity-editor-${{ env.UNITY_VERSION }}-ios-mac

      - name: Unity editörünü ve iOS modülünü kur
        env:
          UNITY_NON_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          unity install "$UNITY_VERSION" --changeset "$UNITY_CHANGESET" --module ios --yes --accept-eula
          unity editors 2>&1 | tail -n 5 || true

      - name: Unity editör önbelleğini kaydet
        if: ${{ always() }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.config/unityhub/downloads
          key: unity-editor-${{ env.UNITY_VERSION }}-ios-mac

      # Giriş arka planda bekler; bağlantı artifact olarak yayınlanır, sonraki adımlar sürerken onaylanabilir
      - name: Unity girişini başlat
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unity-login"
          nohup unity auth login --insecure-storage > "$RUNNER_TEMP/unity-login/login.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/unity-login/pid"
          for i in $(seq 1 60); do
            url="$(grep -o 'https://services\.api\.unity\.com/app-linking[^[:space:]]*' "$RUNNER_TEMP/unity-login/login.log" | head -n1 || true)"
            if [ -n "$url" ]; then break; fi
            sleep 1
          done
          if [ -z "${url:-}" ]; then echo "::error::Giriş bağlantısı alınamadı"; cat "$RUNNER_TEMP/unity-login/login.log"; exit 1; fi
          printf '%s\n' "$url" > "$RUNNER_TEMP/unity-login/url.txt"
          echo "Giriş bağlantısı artifact'a yazıldı (unity-login-url)."

      - name: Giriş bağlantısını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: unity-login-url
          path: ${{ runner.temp }}/unity-login/url.txt
          retention-days: 1

      - name: Girişin onaylanmasını bekle (en çok 30 dk)
        run: |
          pid="$(cat "$RUNNER_TEMP/unity-login/pid")"
          for i in $(seq 1 180); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 10
          done
          cat "$RUNNER_TEMP/unity-login/login.log" | grep -v -E 'https://' || true
          if kill -0 "$pid" 2>/dev/null; then echo "::error::Unity girişi 30 dakikada onaylanmadı"; kill "$pid" || true; exit 1; fi
          unity auth status

      - name: Unity Personal lisansını etkinleştir
        env:
          UNITY_NON_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          unity license activate --personal --accept-eula
          unity license status || true

      - name: Unity ile iOS Xcode projesini üret
        env:
          UNITY_NON_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          extra="-customBuildPath $RUNNER_TEMP/xcode -iosBuildNumber $BUILD_NUMBER"
          if [ -n "$BUNDLE_VERSION" ]; then extra="$extra -iosVersion $BUNDLE_VERSION"; fi
          set +e
          unity build "$GITHUB_WORKSPACE" --target iOS \
            --execute-method PatiDostum.EditorTools.IOSBuilder.Build \
            --output "$RUNNER_TEMP/xcode" \
            --log-file "$RUNNER_TEMP/unity.log" --no-tail \
            --args "$extra"
          code=$?
          set -e
          grep -E "error CS|\[Pati Dostum\]|Build Finished|BuildFailedException|Exception" "$RUNNER_TEMP/unity.log" | tail -n 80 || true
          if [ $code -ne 0 ] || [ ! -d "$RUNNER_TEMP/xcode/Unity-iPhone.xcodeproj" ]; then
            echo "::error::Unity derlemesi başarısız (çıkış $code)"; tail -n 200 "$RUNNER_TEMP/unity.log" || true; exit 1
          fi

      # ASC_KEY_P8 düz metin (-----BEGIN PRIVATE KEY----- ile başlayan) ya da base64 olabilir
      - name: App Store Connect API anahtarını yaz
        run: |
          set -euo pipefail
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          key="$keydir/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | openssl base64 -d -A > "$key"
          fi
          chmod 600 "$key"
          grep -q 'BEGIN PRIVATE KEY' "$key" || { echo "::error::ASC_KEY_P8 çözülemedi (düz metin ya da base64 olmalı)"; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Arşivle (otomatik imza)
        working-directory: ${{ runner.temp }}/xcode
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MyPawPal.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            | tee "$RUNNER_TEMP/archive.log" | tail -n 200

      - name: IPA'yı dışa aktar (app-store-connect)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MyPawPal.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then echo "::error::IPA üretilmedi"; ls -la "$RUNNER_TEMP/export"; exit 1; fi
          cp "$ipa" "$RUNNER_TEMP/MyPawPal-${BUILD_NUMBER}.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/MyPawPal-${BUILD_NUMBER}.ipa" >> "$GITHUB_ENV"
          ls -lh "$ipa"

      - name: IPA'yı artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: MyPawPal-ipa-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          retention-days: 14
          compression-level: 0

      # altool anahtarı ~/.appstoreconnect/private_keys/AuthKey_<KEYID>.p8 yolundan okur
      - name: App Store Connect'e yükle
        if: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Günlükleri sakla (hata ayıklama)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ${{ runner.temp }}/unity.log
            ${{ runner.temp }}/archive.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Unity lisansını iade et ve çıkış yap
        if: ${{ always() }}
        env:
          UNITY_NON_INTERACTIVE: "1"
        run: |
          unity license return --yes || true
          unity auth logout || true

      - name: Anahtarı sil
        if: ${{ always() }}
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
